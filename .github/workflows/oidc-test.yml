name: oidc-probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: get token
        run: |
          TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=octo-sts.mongodb.com" | jq -r .value)

          echo "=== claims (safe to share) ==="
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, sub, aud, repository, workflow}'

          echo ""
          echo "=== exchange attempts ==="
          for ORG in 10gen 10gen-internal mongodb-labs mongodb; do
            echo "--- scope=${ORG} ---"
            curl -si "https://octo-sts.mongodb.com/sts/exchange?scope=${ORG}&identity=probe" \
              -H "Authorization: Bearer $TOKEN" | grep -iE '^HTTP|^content-length|^\{"'
            echo ""
          done
